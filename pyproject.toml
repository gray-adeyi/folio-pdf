[project]
name = "folio-pdf"
version = "0.1.0"
description = "A PDF library for Python powered by bindings to github.com/carlos7ags/folio in GO"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Gbenga Adeyi", email = "adeyigbenga005@gmail.com" }
]
maintainers = [
    { name = "Gbenga Adeyi", email = "adeyigbenga005@gmail.com" }
]
keywords = ["PDF", "pdf", "reportlab", "weasyprint"]
classifiers = [
  "Development Status :: 3 - Alpha",

  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business",
  "Topic :: Text Processing",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Printing",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",

  "Operating System :: OS Independent",
  "Typing :: Typed"
]
requires-python = ">=3.10"
dependencies = [
  "typing-extensions>=3.10.0.0; python_version < '3.11'"
]

[project.urls]
"Bug Tracker" = "https://github.com/gray-adeyi/folio-pdf/issues"
Changelog = "https://github.com/gray-adeyi/folio-pdf/blob/main/CHANGELOG.md"
Documentation = "https://github.com/gray-adeyi/folio-pdf"
Homepage = "https://github.com/gray-adeyi/folio-pdf"
Repository = "https://github.com/gray-adeyi/folio-pdf"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.uv.build-backend]
